services:
  atlasbank-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Database=atlasbank;Username=postgres;Password=postgres
      - Jwt__SecretKey=apenas-dev-local-docker-compose-minimo-32-chars-xyz
      - Jwt__Issuer=AtlasBank.API
      - Jwt__Audience=AtlasBank.Clients
      - Jwt__ExpirationMinutes=60
      - Swagger__Enabled=True
      - PaymentGateway__Provider=Mock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atlasbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: