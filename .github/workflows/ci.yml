name: AtlasBank CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout do código
        uses: actions/checkout@v4
      - name: ⚙️ Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 📦 Restaurar dependências
        run: dotnet restore AtlasBank.slnx
      - name: 🔨 Compilar Solução (Release)
        run: dotnet build AtlasBank.slnx --no-restore --configuration Release
      - name: 🧪 Executar Testes Unitários
        run: dotnet test AtlasBank.slnx --no-build --configuration Release --verbosity normal
      - name: 🐳 Validar Build do Dockerfile
        run: docker build -t atlasbank-api:ci .